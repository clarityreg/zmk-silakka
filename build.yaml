# ========================================
# FileName: build.yaml
# Brief: configuration file for Silakka ZMK firmware
# Board: nice_nano_v2
# Display: nice_view
# =========================================
---
include:
  ### SILAKKA START ###
    ### nice_view START ###
    # nice_nano_v2 + nice_view (Nice!View display)
  - board: nice_nano_v2
    shield: silakka_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Silakka_View\" -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: nice_silakka_left_view
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: silakka_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: nice_silakka_right_view
    ### nice_view END ###
  ### SILAKKA END ###

  ### SETTINGS_RESET ###
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nice_nano_v2_settings_reset
